# A sound device for a machine that has none: it takes any sound and plays nothing.
# capture/host points ALSA at this file (ALSA_CONFIG_PATH) so that a game under Wine finds a
# default device. Rockstar's launcher refuses to start a game without one ("Sound card check
# failed, cannot launch title", 2026-11-23).
pcm.!default {
    type null
}
